version = 1
SPDX-PackageName = "zig-m3u"
SPDX-PackageSupplier = "Jeffrey C. Ollie <jeff@ocjtech.us>"
SPDX-PackageDownloadLocation = "https://git.jcollie.dev/jeff/zig-m3u"

# `build.zig.zon.nix` is generated by zon2nix and would lose a header of its
# own the next time a dependency moved; the lock files hold no comments at all.
[[annotations]]
path = ["flake.lock", "build.zig.zon", "build.zig.zon.nix"]
precedence = "aggregate"
SPDX-FileCopyrightText = "© 2026 Jeffrey C. Ollie <jeff@ocjtech.us>"
SPDX-License-Identifier = "MIT"

# The test playlists. A comment in an M3U file is a line beginning `#`, which
# is also how a tag begins -- so a licence header in one of these would be
# part of the fixture, and the ones copied from RFC 8216 §8 have to be exactly
# what the RFC prints.
[[annotations]]
path = "tests/playlists/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "© 2026 Jeffrey C. Ollie <jeff@ocjtech.us>"
SPDX-License-Identifier = "MIT"
